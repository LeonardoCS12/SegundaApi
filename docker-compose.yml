services:
  postgres:
    image: postgres:15
    container_name: segunda_api_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_segunda:/var/lib/postgresql/data

volumes:
  postgres_data_segunda: